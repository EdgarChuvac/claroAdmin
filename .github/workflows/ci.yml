name: CI

on:
  push:
    branches: [master, "feature/**", "fix/**"]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check backend scripts tests
      - name: JSON de configuración y Firebase válidos
        run: |
          for f in config/*.json firebase/*.json firebase.json; do python -m json.tool "$f" > /dev/null || exit 1; done
      - name: Pruebas
        run: python -m pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Sintaxis del frontend
        run: node --check frontend/app.js

  emulador:
    runs-on: ubuntu-latest
    needs: verificar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -r requirements-dev.txt && npm install -g firebase-tools
      - name: Pruebas contra el emulador de Firestore (valida también firestore.rules)
        run: |
          firebase emulators:exec --only firestore --project demo-claro-admin \
            "FIRESTORE_EMULATOR_HOST=127.0.0.1:8085 python -m pytest tests/integration"
